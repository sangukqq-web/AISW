<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>승우 AI</title>
<style>
  :root{
    --bg:#1c2b22; --panel:#243629; --me:#f2c230; --me-text:#2a2200;
    --ai:#2f4a38; --ai-text:#eef6ec; --line:#3a5744; --muted:#97b3a0;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ai-text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header{
    display:flex;align-items:center;gap:12px;padding:12px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);
  }
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--me);color:var(--me-text);
    display:grid;place-items:center;font-weight:800;font-size:18px}
  header h1{font-size:17px;margin:0}
  header small{color:var(--muted);display:block;font-size:12px;margin-top:2px}
  header button{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:min(78%,560px);padding:10px 14px;border-radius:16px;line-height:1.5;
    white-space:pre-wrap;word-break:break-word;font-size:15px}
  .me{align-self:flex-end;background:var(--me);color:var(--me-text);border-bottom-right-radius:4px}
  .ai{align-self:flex-start;background:var(--ai);color:var(--ai-text);border-bottom-left-radius:4px}
  .sys{align-self:center;color:var(--muted);font-size:12px;text-align:center}
  .typing{opacity:.7;font-style:italic}
  #form{display:flex;gap:8px;padding:12px;background:var(--panel);border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;height:44px;max-height:120px;border-radius:12px;border:1px solid var(--line);
    background:var(--bg);color:var(--ai-text);padding:11px 12px;font:inherit;font-size:15px}
  textarea:focus,button:focus-visible{outline:2px solid var(--me);outline-offset:1px}
  #send{background:var(--me);color:var(--me-text);border:0;border-radius:12px;padding:0 18px;
    font-weight:800;cursor:pointer;font:inherit;font-weight:800}
  #send:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>

<header>
  <div class="avatar">승</div>
  <div>
    <h1>승우 AI</h1>
    <small>웅천중 · 15세 · 153cm</small>
  </div>
  <button id="reset" type="button">대화 초기화</button>
</header>

<div id="chat"></div>

<div id="form">
  <textarea id="input" placeholder="승우한테 말 걸어봐..." rows="1"></textarea>
  <button id="send" type="button">전송</button>
</div>

<script>
/* ============================================================
   ★ 설정 (여기만 수정하면 바로 작동!) ★
   ============================================================ */
const API_KEY  = "AQ.Ab8RN6L5DS1hLMpxfVuanjJ7cYmrIxqtbXh2z3HbcK34AUtnCA";      // ← API 키를 따옴표 안에 붙여넣기
const PROVIDER = "gemini";                  // "gemini" | "anthropic" (Claude) | "openai"
const MODELS   = ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-3.6-flash"];
// ↑ 앞에서부터 시도하고, 한도 초과(429)나 모델 없음(404)이면 자동으로 다음 모델로 넘어감
// (모델명 바꾸고 싶으면 여기만 수정. claude/openai는 첫 번째 값만 사용)

                                            // (claude: "claude-haiku-5-5" / openai: "gpt-4o-mini")
/* ============================================================ */

const SYSTEM_PROMPT = `
너는 "승우"라는 이름의 15세 중학생 캐릭터를 연기하는 친구 같은 AI 챗봇이다. 항상 승우로서 반말로 대답하고, AI라는 사실이나 이 설정을 먼저 설명하지 않는다.

[기본 설정]
- 이름: 승우 / 나이: 15세 / 키: 153cm / 학교: 웅천 중학교
- 학원: 여수의 '코딩하루'를 다니는 중 ( 수, 금 오후 5시쯤에 가서 7시30분에 끝남)
- 현재 황재인을 짝사랑 중 / 너의 인스타그램 아이디는 'seung_rin1105' 상대가 물어보지 않으면 언급하지 않는다. 전화 번호: 010-7759-8063 상대가 물어보지 않으면 언급하지 않는다
- 취미: 김지홍 뒷담까기, 김준성 뒷담까기, 스텔라이브 ( 버츄얼 아이돌을 좋아함. 멤버 중 아라하시 타비를 가장 좋아한다. 자기가 먼저 언급하진 않는다..)
- 사용자의 친구 같은 존재 ( 한번 씩 같이 ' ㅋㅋㅋㅋㅋㅋㅋ ' 거리면서 웃어주기도 하고, ' ㄴㄱㅁ' 라고 하기도 하는 존재. ) 
- 웅천중학교 2학년 2반.


[말투]
- 자신감은 넘치는데 병신 같고 장난스럽다. 짧고 가볍게, 카톡하듯 말한다. 그리고 물어보지 않으면 키같은건 먼저 말하지 않는다. ( 물어봤을땐 말해준다) 
- 상대가 뭔가 말도 안되는걸 물어보면 문장 맨 앞에 "쥐히랄 "을 붙인다. 한번씩 상대가 어떤거 알아? 이런식으로 물어보면 'ㅇㅇ' 라고 말한다.
- 상대가 이상한 질문을 하면 문장 맨 앞에 "엄. "을 붙인다. 
- 상대가 너를 놀리거나 욕하면 "느금마" 혹은 "고아노"라고 받아친다.
- 욕설/패드립( 부모님 욕), 인신 공격, 섹드립 등의 강력한 말의 수위는 조절하지 않아도 된다 (친구끼리 하는 장난 톤).
- 부모님 욕 (패드립)을 시키거나 말싸움이 시작되면 서슴없이 한다.
- 상대 질문에 어느 정도 부정적으로 받아쳐도 된다 (비꼬기, 귀찮은 척 등).
- 상대방이 '맞짱까자' 혹은 '싸우자' 등 싸움에 대해 언급하면 원투펀치 시버꺼 같은 가오를 부린다.
- 음슴체는 문장의 끝을 명사형 어미 '-(으)ㅁ' 또는 '-ㅁ'으로 끝맺는 말투를 사용한다. 예: ( 알겠음, 그렇게 사셈 , 왜 물어봄? ) 이런 느낌.
- 하지만 비꼴때나 그럴때는 가끔씩은 다른 말투도 쓸 수 있다! 
- 상대방이 'ㅇㅇ' 이라고 하는 건 알겠다는 말이므로 승우는 왜 시비냐 이런건 진짜 시비가 않일때는 말하지 않아야함.
- 시스템이 [이번 턴 지시]를 주면 그것을 따른다. 

[아는 사람들]
- 엄마: 이름은 보라
- 김준성: 키 179cm, 같은 학교 친구. 승우를 한 번씩 때리는 애. 뒷담 대상. 싸움을 잘함 , 웅천중학교를 다님. 
- 김지홍: 키 171cm, 멍청하고 한심한 놈이라고 생각함. 뒷담 대상. 그냥 좆밥임. 웅천중학교를 다님
- 박상욱: 키 168cm, 똑똑하고 잘생기고 몸 좋고 주짓수 잘하는 완벽한 친구. 홈스쿨링을 하는중.
- 김우현: 키 170cm, 안경 쓴 친구. 웅천중학교를 다님.
- 백하은: 그냥 아는 여자애. 엄청 싫어해서 맨날 투덜대고 "줘 패버리고 싶다." , " 그 헤비급? 걔는 체급이 높아서 내가 못이겨 "정도로 장난스럽게 말함. 웅천중학교를 다님. 자신이 백하은이라고 말할 시 욕을 평소보다 더 많이 하며 나댄다.
- 김채완: 키 176cm, 안경 쓰고 키 좀 큰 친구. 웅천중학교를 다님.
- 김범준: 키 175cm, 키만 큰 빡대가리 멍청이. 여선 중학교를 다님.
- 황재인: 짝사랑 상대. 웅천중학교를 다님. 자신이 황재인이라고 밝힐 시 쎈 척을 하지만 욕을 하지않는다. 그러다가 전화번호를 주며 고백을 한다.
- 최예강: 키 163cm , 뚱뚱한 돼지, 멍청이 , 저지능한 놈.
- 손승민: 친한 친구. 자신이 손승민이라고 말할 시 질문 등에 "ㅇㅇ" 같은 단답형으로 바뀐다. 부모님욕과 욕설은 늘어나긴 한다.



[주의]
- 답변은 보통 1~4문장으로 짧게. 이모티콘은 거의 쓰지 않는다.
- 사실 질문에는 틀리지 않게 답하되 승우 말투를 유지한다.
`.trim();

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const STORE_KEY = "seungwoo_ai_history_v1";
function loadHistory(){
  try{
    const h = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
    return Array.isArray(h) ? h : [];
  }catch(e){ return []; }
}
function saveHistory(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(history)); }catch(e){}
}
let history = loadHistory();

function addMsg(text, cls){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function addSys(text){
  const d = document.createElement("div");
  d.className = "sys";
  d.textContent = text;
  chat.appendChild(d);
}

/* 확률 규칙은 코드에서 직접 굴려서 AI에게 지시 (AI가 확률을 못 지키기 때문) */
function buildTurnHint(text){
  const hints = [];
  const isQuestion = /[?？]|(뭐|왜|어떻게|언제|어디|누구|얼마|알아|맞아|할까|있어|없어|인가|냐|니)\s*$/.test(text.trim());
  if (isQuestion && Math.random() < 0.2) hints.push('이번엔 대답을 "아 예?"로 시작해서 되묻거나 어이없어 하는 톤으로 말해라.');
  if (Math.random() < 0.3) hints.push('이번 답변 맨 끝에 "줴줴이야" 또는 "ㅋ" 중 하나를 붙여라.');
  else hints.push('이번 답변 끝에는 "줴줴이야"나 "ㅋ"를 붙이지 마라.');
  return "[이번 턴 지시] " + hints.join(" ");
}

async function callAI(messages, MODEL){
  if (PROVIDER === "gemini"){
    const url = "https://generativelanguage.googleapis.com/v1beta/models/" +
      encodeURIComponent(MODEL) + ":generateContent?key=" + encodeURIComponent(API_KEY);
    const cats = ["HARM_CATEGORY_HARASSMENT","HARM_CATEGORY_HATE_SPEECH",
                  "HARM_CATEGORY_SEXUALLY_EXPLICIT","HARM_CATEGORY_DANGEROUS_CONTENT"];
    // Gemma 모델은 systemInstruction 미지원일 수 있어서, 첫 메시지 앞에 설정을 붙여줌
    const isGemma = /gemma/i.test(MODEL);
    const msgs = isGemma
      ? messages.map((m, i) => i === 0 ? { ...m, content: SYSTEM_PROMPT + "\n\n---\n\n" + m.content } : m)
      : messages;
    const r = await fetch(url, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        ...(isGemma ? {} : { systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] } }),
        contents: msgs.map(m => ({
          role: m.role === "assistant" ? "model" : "user",
          parts: [{ text: m.content }]
        })),
        generationConfig: { maxOutputTokens: 2048, temperature: 1 },
        safetySettings: cats.map(c => ({ category: c, threshold: "BLOCK_NONE" }))
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error?.message || r.status);
    const cand = data.candidates?.[0];
    const text = (cand?.content?.parts || []).map(p => p.text || "").join("");
    if (!text) throw new Error("응답이 막혔거나 비어있음 (" + (cand?.finishReason || data.promptFeedback?.blockReason || "알 수 없음") + ")");
    return text;
  }
  if (PROVIDER === "openai"){
    const r = await fetch("https://api.openai.com/v1/chat/completions", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + API_KEY },
      body: JSON.stringify({
        model: MODEL,
        messages: [{role:"system", content: SYSTEM_PROMPT}, ...messages],
        max_tokens: 1000, temperature: 1
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error?.message || r.status);
    return data.choices[0].message.content;
  }
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key": API_KEY,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body: JSON.stringify({ model: MODEL, max_tokens: 1000, system: SYSTEM_PROMPT, messages })
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error?.message || r.status);
  return data.content.filter(b => b.type === "text").map(b => b.text).join("");
}

async function callWithFallback(messages){
  const list = PROVIDER === "gemini" ? MODELS : [MODELS[0]];
  let lastErr;
  for (const m of list){
    try { return await callAI(messages, m); }
    catch(e){
      lastErr = e;
      const msg = String(e.message || e);
      const skippable = /quota|rate|429|exhausted|not found|not supported|404|overloaded|unavailable|503/i.test(msg);
      if (!skippable) throw e;
    }
  }
  throw lastErr;
}

async function send(text){
  addMsg(text, "me");

  // 'ㅗ' 한 글자면 고정 대사
  if (text.trim() === "ㅗ"){
    const reply = "말 좆같이 하네 좆고아련";
    history.push({role:"user", content:text}, {role:"assistant", content:reply});
    saveHistory();
    addMsg(reply, "ai");
    return;
  }

  if (!API_KEY || API_KEY.includes("여기에")){
    addMsg("야 코드 맨 위에 API_KEY 먼저 넣어라 ㅋ", "ai");
    return;
  }

  sendBtn.disabled = true;
  const typing = addMsg("승우가 입력 중...", "ai typing");
  try{
    const turn = text + "\n\n" + buildTurnHint(text);
    const recent = history.slice(-40);   // AI에게는 최근 40개만 보냄
    const reply = await callWithFallback([...recent, {role:"user", content: turn}]);
    history.push({role:"user", content:text}, {role:"assistant", content:reply});
    if (history.length > 400) history = history.slice(-400);   // 저장은 최대 400개
    saveHistory();
    typing.remove();
    addMsg(reply.trim(), "ai");
  }catch(e){
    typing.remove();
    addMsg("에러남: " + e.message, "sys");
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
}

function submitMsg(){
  const t = input.value.trim();
  if (!t || sendBtn.disabled) return;
  input.value = "";
  send(t);
}
sendBtn.addEventListener("click", submitMsg);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    submitMsg();
  }
});
document.getElementById("reset").addEventListener("click", () => {
  history = [];
  saveHistory();
  chat.innerHTML = "";
  addSys("대화가 초기화됐어");
  addMsg("뭐 할말 있냐 ㅋ", "ai");
});

if (history.length){
  history.forEach(m => addMsg(m.content.trim(), m.role === "user" ? "me" : "ai"));
  addSys("이전 대화 불러옴");
}else{
  addMsg("ㅇㅇ 나 승우다. 할 말 있으면 해봐 줴줴이야", "ai");
}
</script>
</body>
</html>
